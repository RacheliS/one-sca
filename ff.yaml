# File: docker-compose.yml
services:
  webapp:
    image: my-app:latest
    environment:
      # Finding: Hardcoded credentials in container environment
      - SENDGRID_API_KEY=SG.V1234567890abcdefghij.1234567890abcdefghijklmnopqrstuvwxyz
      - GF_SECURITY_ADMIN_PASSWORD=admin_secret_pass
